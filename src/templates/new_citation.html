{% extends "layout.html" %}

{% block title %}
Luo uusi viite
{% endblock %}

{% block body %}

<h2>Luo uusi viite</h2>

<form action="/choose_citation_type" method="post">
  <table class="form-table">

    <tr>
      <td class="label"><label for="entry_type">Viitemerkintätyyppi:</label></td>
      <td class="control">
        <select class="select" id="entry_type" name="entry_type">
          {% for entry_type in entry_types %}
            <option value="{{ entry_type }}">
            {{ entry_type }}
            </option>
          {% endfor %}
        </select>
      </td>
    </tr>

  </table>

  <button id="submit" type="submit">Täytä lomake</button>

</form>

{% endblock %}
