{% extends "layout.html" %}

{% block title %}
Luo uusi viite
{% endblock %}

{% block body %}

<h2>Luo uusi viite</h2>

<form action="/create_citation" method="post">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul>
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  <label for="title">Otsikko:</label>
  <input type="text" name="title">
  <br>
  <label for="type">Tyyppi:</label>
  <input type="text" name="type">
  <br>
  <label for="author">Tekijä:</label>
  <input type="text" name="author">
  <br>
  <button type="submit">
    Luo
  </button>
</form>

{% endblock %}
