{% extends "layout.html" %}

{% block title %}
Luo uusi artikkeli
{% endblock %}

{% block body %}

<h2>Luo uusi artikkeli</h2>

<form action="/create_citation" method="post">
  <table class="form-table">

    <tr>
      <td class="label"><label for="author">Tekijä:</label></td>
      <td class="control">
        <input class="input" id="author" type="text" name="author" placeholder="Pakollinen kenttä" required />
      </td>
    </tr>

    <tr>
      <td class="label"><label for="title">Otsikko:</label></td>
      <td class="control">
        <input class="input" id="title" type="text" name="title" placeholder="Pakollinen kenttä" required />
      </td>
    </tr>

    <tr>
      <td class="label"><label for="journal">Lehti:</label></td>
      <td class="control">
        <input class="input" id="journal" type="text" name="journal" placeholder="Pakollinen kenttä" required />
      </td>
    </tr>

    <tr>
      <td class="label"> <label for="year">Julkaisuvuosi:</label></td>
      <td class="control">
        <input class="input" id="year" type="number" min="0" max="2099" step="1" value="2026" name="year"  placeholder="Pakollinen kenttä" required />
      </td>
    </tr>

    <tr>
      <td class="label"><label for="volume">Painos:</label></td>
      <td class="control">
        <input class="input" id="volume" type="text" name="volume" />
      </td>
    </tr>

    <tr>
      <td class="label"><label for="number">Numero:</label></td>
      <td class="control">
        <input class="input" id="number" type="text" name="number" />
      </td>
    </tr>

    <tr>
      <td class="label"><label for="pages">Sivut:</label></td>
      <td class="control">
        <input class="input" id="pages" type="text" name="pages" />
      </td>
    </tr>

    <tr>
      <td class="label"><label for="month">Julkaisukuukausi:</label></td>
      <td class="control">
          <input class="input" id="month" type="number" min="1" max="12" step="1" name="month" />
      </td>
    </tr>

    <tr>
      <td class="label"><label for="note">Muistiinpano:</label></td>
      <td class="control">
        <input class="input" id="note" type="text" name="note" />
      </td>
    </tr>

    <tr>
      <td class="label"><label for="annote">Kuvaus:</label></td>
      <td class="control">
        <input class="input" id="annote" type="text" name="annote" />
      </td>
    </tr>

  </table>
  <input type="hidden" name="entry_type" value="article" />
  <button id="submit" type="submit">Luo</button>

</form>

{% endblock %}
