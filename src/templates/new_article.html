{% extends "layout.html" %}

{% block title %}
Luo uusi artikkeli
{% endblock %}

{% block body %}

<h2>Luo uusi artikkeli</h2>

<form action="/create_citation" method="post">
  <table class="form-table">

    <h3>Pakolliset kentät:</h3>

    <tr>
      <td class="label"><label for="author">Tekijä:</label></td>
      <td class="control">
        <input class="input" id="author" type="text" name="author">
      </td>
    </tr>

    <tr>
      <td class="label"><label for="title">Otsikko:</label></td>
      <td class="control">
        <input class="input" id="title" type="text" name="title">
      </td>
    </tr>

    <tr>
      <td class="label"><label for="">Lehti:</label></td>
      <td class="control">
        <input class="input" id="publisher" type="text" name="publisher">
      </td>
    </tr>

    <tr>
      <td class="label"> <label for="year">Julkaisuvuosi:</label></td>
      <td class="control">
        <input class="input" id="year" type="number" min="0" max="2099" step="1" value="2026" name="year"/>
      </td>
    </tr>

    </table>

    <table class="form-table">

    <h3>Vapaavalintaiset kentät:</h3>

    <tr>
      <td class="label"><label for="">Painos:</label></td>
      <td class="control">
        <input class="input" id="edition" type="text" name="edition">
      </td>
    </tr>

    <tr>
      <td class="label"><label for="">Sivut:</label></td>
      <td class="control">
        <input class="input" id="pages" type="text" name="pages">
      </td>
    </tr>

    <tr>
      <td class="label"><label for="month">Julkaisukuukausi:</label></td>
      <td class="control">
        <input class="input" id="month" type="number" min="1" max="12" step="1" value="1" name="month" />
      </td>
    </tr>

    <tr>
      <td class="label"><label for="howpublished">URL:</label></td>
      <td class="control">
        <input class="input" id="howpublished" type="text" name="howpublished">
      </td>
    </tr>

  </table>
  <input type="hidden" name="type" value="article" />
  <button id="submit" type="submit">Luo</button>

</form>

{% endblock %}
